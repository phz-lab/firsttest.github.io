'浦东经济组']}[x.id];[x.subject,x.area,x.classType,x.group]=m;x.checkedBefore=x.id===7});let taskSelected=new Set();let tasks=[{id:'RW20261103001',lesson:3,created:'2026-11-03 20:12',status:'已完成'}],selected=new Set(),filters={},searched=false;const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function eligible(x){return x.video==='已有录播'&&x.status==='未生成'}function visible(){return searched?lessons.filter(x=>(!$('#excludeChecked').checked||!x.checkedBefore)&&(!filters.subject||x.subject===filters.subject)&&(!filters.area||x.area===filters.area)&&(!filters.classType||x.classType===filters.classType)&&(!filters.group||x.group===filters.group)&&(!filters.classId||x.classId.toLowerCase()===filters.classId.toLowerCase())&&(!filters.q||(x.name+x.teacher).includes(filters.q))&&(!filters.start||x.date>=filters.start)&&(!filters.end||x.date<=filters.end)&&(!filters.video||x.video===filters.video)&&(!filters.status||x.status===filters.status)):[]}function badge(s){return `<span class="tag ${s==='已完成'?'green':s==='转写中'?'blue':s==='暂无录播'?'orange':''}">${esc(s)}</span>`}function render(){const rows=visible().sort((a,b)=>Number(selected.has(b.id))-Number(selected.has(a.id)));const pool=rows.filter(x=>eligible(x)&&(!$('#excludeChecked').checked||!x.checkedBefore));$('#sample').disabled=!searched||!filters.group||!pool.length;$('#poolHint').textContent=searched?`符合条件 ${rows.length} 节，可抽取 ${pool.length} 节${filters.group?'':'（选择教学组后可抽取）'}`:'查询后显示可抽取数量';$('#lessonRows').innerHTML=rows.length?rows.map(x=>`<tr><td><input type="checkbox" data-id="${x.id}" ${selected.has(x.id)?'checked':''} ${eligible(x)?'':'disabled'} aria-label="选择${esc(x.name)} ${esc(x.session)}"></td><td><div class="course">${esc(x.name)}</div><div class="sub">${esc(x.session)} · 班级编号：${x.classId}</div></td><td>${x.date}<div class="sub">${x.time}</div></td><td>${x.teacher}</td><td>${badge(x.video)}<div class="sub" style="margin- function modal(title,body,foot){$('#dialogTitle').textContent=title;$('#dialogBody').innerHTML=body;$('#dialogFoot').innerHTML=foot;$('#dialog').classList.remove('hidden')}function hide(){$('#dialog').classList.add('hidden')}function toast(s){$('#toast').textContent=s;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),2200)}function openText(id){let x=lessons.find(v=>v.id===id);modal('课堂文字记录',`<div class="summary"><strong>${esc(x.name)} · ${x.session}</strong><br>上课时间：${x.date} ${x.time}　授课教师：${x.teacher}<br>录播时长：${x.duration}</div><p class="mock">以下文字为演示样例，不对应真实录播内容。</p><div class="record"><span class="time">00:00:12</span>老师：同学们好，我们先回顾一下上一节课的重点内容。</div><div class="record"><span class="time">00:02:35</span>老师：今天我们结合例题，看看如何分析题目中的已知条件。</div><div class="record"><span class="time">00:05:18</span>老师：大家可以先独立思考一下，然后我们一起讨论解题思路。</div>`,`<button class="btn" onclick="hide()">关闭</button><button class="btn primary" onclick="downloadText(${id})">下载文字</button>`)}function downloadText(id){let x=lessons.find(v=>v.id===id);let content=`${x.name} ${x.session}\n演示样例，不对应真实录播内容\n\n[00:00:12] 老师：同学们好，我们先回顾一下上一节课的重点内容。\n[00:02:35] 老师：今天我们结合例题，看看如何分析题目中的已知条件。\n[00:05:18] 老师：大家可以先独立思考一下，然后我们一起讨论解题思路。`;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:'text/plain;charset=utf-8'}));a.download=x.name+'-演示文字.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
document.addEventListener('click',e=>{let tab=e.target.closest('.tab');if(tab){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t===tab));['lessons','tasks'].forEach(id=>$('#'+id).classList.toggle('hidden',id!==tab.dataset.tab))}let view=e.target.closest('.view');if(view)openText(+view.dataset.id);let replace=e.target.closest('.replace');if(replace){let candidates=visible().filter(x=>eligible(x)&&!selected.has(x.id)&&(!$('#excludeChecked').checked||!x.checkedBefore));if(!candidates.length){toast('没有其他可替换的课次，请调整筛选条件');return}selected.delete(+replace.dataset.id);selected.add(candidates[Math.floor(Math.random()*candidates.length)].id);render();toast('已换一条课次')}});$('#lessonRows').addEventListener('change',e=>{if(e.target.dataset.id){let id=+e.target.dataset.id;e.target.checked?selected.add(id):selected.delete(id);render()}});$('#selectAll').onchange=e=>{visible().filter(eligible).forEach(x=>e.target.checked?selected.add(x.id):selected.delete(x.id));render()};$('#search').onclick=()=>{let start=$('#dateStart').value,end=$('#dateEnd').value;if(!$('#subject').value&&!$('#area').value&&!$('#classType').value&&!$('#group').value&&!$('#keyword').value.trim()&&!$('#classId').value.trim()&&!start&&!end&&!$('#videoFilter').value&&!$('#statusFilter').value){toast('请至少填写一项筛选条件');return}if(start&&end&&start>end){toast('开始日期不能晚于结束日期');return}selected.clear();filters={subject:$('#subject').value,area:$('#area').value,classType:$('#classType').value,group:$('#group').value,q:$('#keyword').value.trim(),classId:$('#classId').value.trim(),start,end,video:$('#videoFilter').value,status:$('#statusFilter').value};searched=true;render()};$('#fillExample').onclick=()=>{$('#subject').value='数学';$('#area').value='浦西';$('#classType').value='1 对 1';$('#group').value='浦西1v1数学一组';$('#excludeChecked').checked=false;$('#sampleCount').value='3';$('#keyword').value='';$('#classId').value='';$('#dateStart').value='';$('#dateEnd').value='';$('#videoFilter').value='';$('#statusFilter').value='';toast('已填入教学组示例，点击查询查看课次')};$('#keyword').onkeydown=e=>{if(e.key==='Enter')$('#search').click()};$('#reset').onclick=()=>{$('#subject').value='';$('#area').value='';$('#classType').value='';$('#group').value='';$('#excludeChecked').checked=false;$('#keyword').value='';$('#classId').value='';$('#dateStart').value='';$('#dateEnd').value='';$('#videoFilter').value='';$('#statusFilter').value='';filters={};searched=false;selected.clear();render()};$('#generate').onclick=()=>{let items=lessons.filter(x=>selected.has(x.id));modal('确认生成文字',`<p>将为以下 <strong>${items.length}</strong> 个课次分别创建转写任务。</p><div class="summary">${items.map(x=>`<div>${esc(x.name)} · ${x.session}<br><span class="sub">${x.date} ${x.time}　录播 ${x.duration}</span></div>`).join('')}</div><p class="mock">演示环境：任务与结果均为模拟，不会消耗真实资源。</p>`,`<button class="btn" onclick="hide()">取消</button><button class="btn primary" id="confirm">确认生成</button>`);$('#confirm').onclick=()=>{let now=new Date(),stamp=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');items.forEach((x,i)=>{x.status='转写中';let task={id:'DEMO'+Date.now()+i,lesson:x.id,created:stamp,status:'转写中'};tasks.unshift(task);setTimeout(()=>{x.status='已完成';task.status='已完成';render()},2500)});selected.clear();hide();render();toast('已创建 '+items.length+' 个模拟转写任务');document.querySelector('[data-tab="tasks"]').click()}};$('#taskRows').addEventListener('change',e=>{if(e.target.dataset.task){e.target.checked?taskSelected.add(e.target.dataset.task):taskSelected.delete(e.target.dataset.task);render()}});$('#selectTasks').onchange=e=>{tasks.filter(t=>t.status==='已完成').forEach(t=>e.target.checked?taskSelected.add(t.id):taskSelected.delete(t.id));render()};function makeZip(files){const enc=new TextEncoder(), parts=[],central=[];let offset=0;const u16=n=>[n&255,n>>>8&255],u32=n=>[n&255,n>>>8&255,n>>>16&255,n>>>24&255];function crc(bytes){let c=0xffffffff;for(const b of bytes){c^=b;for(let i=0;i<8;i++)c=(c>>>1)^(-(c&1)&0xedb88320)}return(c^0xffffffff)>>>0}for(const file of files){let name=enc.encode(file.name),data=enc.encode('\ufeff'+file.text),check=crc(data),local=new Uint8Array([80,75,3,4,...u16(20),...u16(0x800),...u16(0),...u16(0),...u16(0),...u32(check),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0)]);parts.push(local,name,data);central.push(new Uint8Array([80,75,1,2,...u16(20),...u16(20),...u16(0x800),...u16(0),...u16(0),...u16(0),...u32(check),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset)]),name);offset+=local.length+name.length+data.length}let size=central.reduce((n,b)=>n+b.length,0),end=new Uint8Array([80,75,5,6,...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(size),...u32(offset),...u16(0)]);return new Blob([...parts,...central,end],{type:'application/zip'})}$('#downloadBatch').onclick=()=>{let chosen=tasks.filter(t=>taskSelected.has(t.id)&&t.status==='已完成');let files=chosen.map(t=>{let x=lessons.find(l=>l.id===t.lesson);return {name:`${x.name}_${x.session}_${t.id}.txt`,text:`班级：${x.name}　${x.session}\n任务编号：${t.id}\n演示样例，不对应真实录播内容\n\n[00:00:12] 老师：同学们好，我们先回顾一下上一节课的重点内容。\n[00:02:35] 老师：今天我们结合例题，看看如何分析题目中的已知条件。\n[00:05:18] 老师：大家可以先独立思考一下，然后我们一起讨论解题思路。`}});let a=document.createElement('a');a.href=URL.createObjectURL(makeZip(files));a.download='批量转写文字_演示.zip';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('已下载 '+chosen.length+' 个任务的文字文件')};$('#excludeChecked').onchange=()=>{if($('#excludeChecked').checked)lessons.filter(x=>x.checkedBefore).forEach(x=>selected.delete(x.id));render()};$('#sample').onclick=()=>{let count=Number($('#sampleCount').value),pool=visible().filter(x=>eligible(x)&&(!$('#excludeChecked').checked||!x.checkedBefore));if(!Number.isInteger(count)||count<1){toast('请输入大于 0 的整数');return}if(count>pool.length){toast(`最多可抽取 ${pool.length} 节，请调整数量或条件`);return}for(let i=pool.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}selected.clear();pool.slice(0,count).forEach(x=>selected.add(x.id));render();toast(`已随机选出 ${count} 节，可勾选调整或换一条`)};$('#close').onclick=hide;$('#dialog').onclick=e=>{if(e.target.id==='dialog')hide()};document.addEventListener('keydown',e=>{if(e.key==='Escape')hide()});render();
</script></body></html>
