<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>添加反馈</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#606266;font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.page{background:#fff;min-height:100vh;border:1px solid #e7e9ee}.head{height:46px;padding:12px 22px;border-bottom:1px solid #ebeef5;color:#303133;font-weight:600;font-size:15px}.content{padding:20px 24px 110px}section{margin-bottom:30px}h2{font-size:16px;color:#606266;margin:0 0 20px;font-weight:600}.info{display:grid;grid-template-columns:repeat(3,1fr);gap:15px 20px}.row{display:flex;align-items:flex-start;margin:0 0 20px;gap:10px}.label{flex:0 0 155px;text-align:left;white-space:nowrap}.req:before{content:'*';color:#f56c6c;margin-right:5px}.choices{display:flex;gap:12px 27px;flex-wrap:wrap}.choice{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;cursor:pointer}input[type=checkbox],input[type=radio]{accent-color:#409eff;width:15px;height:15px;margin:2px 0}.stars{display:flex;gap:5px}.star{border:0;background:none;color:#c5d1df;font-size:25px;line-height:21px;padding:0;cursor:pointer}.star.selected{color:#f7ba2a}.editor{border:1px solid #dcdfe6}.toolbar{border-bottom:1px solid #e6e9ef;height:35px;display:flex;align-items:center;color:#909399;padding:0 10px;gap:18px;font-size:13px;overflow:hidden;white-space:nowrap}.toolbar span{cursor:default}textarea{display:block;width:100%;min-height:145px;resize:vertical;border:0;outline:0;padding:12px;font:14px/1.9 inherit;color:#606266}textarea::placeholder,input::placeholder{color:#c0c4cc}.continue{display:flex;align-items:center;gap:22px;flex-wrap:wrap}.count{width:180px;height:34px;border:1px solid #dcdfe6;border-radius:4px;padding:0 10px;font:inherit;color:#606266}.count:focus{outline:1px solid #409eff;border-color:#409eff}.error{color:#f56c6c;font-size:12px;margin-top:5px}.footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ebeef5;padding:12px 22px;display:flex;justify-content:flex-end;gap:10px}button.action{padding:7px 17px;border:1px solid #dcdfe6;border-radius:4px;background:#fff;color:#606266;cursor:pointer}button.primary{background:#409eff;color:#fff;border-color:#409eff}.notice{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#f0f9eb;color:#67c23a;border:1px solid #e1f3d8;border-radius:4px;padding:10px 20px;z-index:2}.hidden{display:none!important}@media(max-width:700px){.content{padding:18px 16px 100px}.info{grid-template-columns:1fr}.row{display:block}.label{margin-bottom:8px}.choices{gap:12px 18px}.toolbar{gap:12px}}
.head{height:auto;min-height:46px;display:flex;align-items:center;justify-content:space-between;gap:12px}.switcher{display:flex;gap:6px;flex-wrap:wrap}.switcher button{background:white;border:1px solid #dcdfe6;color:#606266;border-radius:4px;padding:5px 9px;cursor:pointer}.switcher button.active{color:#409eff;border-color:#409eff;background:#ecf5ff}.mobile-mode{background:#f3f5fa}.mobile-mode .content,.mobile-mode #viewing{max-width:430px;margin:auto}.mobile-mode .content section{background:white;border-radius:10px;padding:15px;margin-bottom:12px}.mobile-mode .info{display:grid;grid-template-columns:1fr}.mobile-mode .info>div{padding:7px 0;border-bottom:1px solid #f2f3f5}.mobile-mode .row{display:block}.mobile-mode .label{margin-bottom:8px}.mobile-mode .choices{gap:12px 18px}.mobile-mode .toolbar{display:none}.mobile-mode .footer{left:50%;right:auto;transform:translateX(-50%);width:min(100%,430px)}.mobile-mode .footer .action{flex:1}.view-shell{background:#fff;padding:32px;min-height:80vh}.view-section{margin-bottom:36px}.view-section h2{color:#2463bc}.view-row{display:grid;grid-template-columns:170px 1fr;gap:18px;padding:9px 0;white-space:pre-wrap;overflow-wrap:anywhere}.view-label{color:#315583;font-weight:600}.view-value{color:#606266}.mobile-mode #viewing{padding:12px}.mobile-mode .view-shell{background:transparent;padding:0}.mobile-mode .view-section{background:#fff;border-radius:10px;padding:16px;margin-bottom:12px}.mobile-mode .view-row{grid-template-columns:130px 1fr;gap:8px;border-bottom:1px solid #f3f4f6;font-size:13px}.mobile-mode .view-value{text-align:right}.view-actions{padding:12px 0}.mobile-mode .view-actions button{width:100%}@media(max-width:700px){.head{align-items:flex-start;flex-direction:column}.switcher{gap:4px}.switcher button{font-size:12px}.view-shell{padding:20px 16px}.view-row{grid-template-columns:120px 1fr}} </style></head><body><div class="page"><header class="head">授课反馈 <nav class="switcher"><button type="button" data-mode="pc-edit">PC 编辑</button><button type="button" data-mode="pc-view">PC 查看</button><button type="button" data-mode="mobile-edit">移动端编辑</button><button type="button" data-mode="mobile-view">移动端查看</button></nav></header><main class="content" id="editing"><section><h2>基本信息</h2><div class="info"><div>学生姓名： 示例学生</div><div>课程名称： 升学规划课-综合-线上</div><div>授课老师： 示例教师</div><div>上课时间： 2026-07-13 21:00 - 21:30</div></div></section><form id="form" novalidate><section><h2>学生点评</h2><div id="assessment"></div></section><section><h2>课后学习建议</h2><div class="editor"><div class="toolbar" aria-hidden="true"><span>正文⌄</span><span>❝</span><span><b>B</b></span><span><u>U</u></span><span><i>I</i></span><span>⋯</span><span>A⌄</span><span>默认字号⌄</span><span>默认字体⌄</span><span>默认行高⌄</span><span>☷</span><span>☑</span><span>↶</span><span>↷</span></div><textarea id="advice" aria-label="课后学习建议" placeholder="1、作业和DDL&#10;2、学习建议"></textarea></div></section><section><h2>是否需要继续上课</h2><div class="row"><div class="label req">是否需要继续上课</div><div><div class="continue"><label class="choice"><input type="radio" name="continue" value="yes">是</label><label class="choice"><input type="radio" name="continue" value="no">否</label><input class="count hidden" id="count" type="number" min="1" step="1" placeholder="建议续课时长（小时）" aria-label="建议续课时长"></div><div class="error" id="continueError"></div></div></div></section><div class="footer"><button class="action" type="button" id="cancel">取消</button><button class="action primary" type="submit">提交</button></div></form></main><main id="viewing" class="hidden"></main></div><div class="notice hidden" id="notice" role="status">提交成功（数据仅保存在当前浏览器）</div><script>
const groups=[['课堂表现',['态度端正','课后认真','上课积极','思维敏捷','理解到位','仍需努力']],['存在问题',['背诵不足','练习不足','理解不到位','态度不端正','基础不好','无','粗心','不记笔记','未开摄像头']]];const rates=['课堂参与度','上课集中程度','本节课内容掌握度','历史知识点掌握度'];const box=document.querySelector('#assessment');groups.forEach(([name,items],i)=>{let row=document.createElement('div');row.className='row';row.innerHTML=`<div class="label req">${name}：</div><div><div class="choices">${items.map(x=>`<label class="choice"><input type="checkbox" name="group${i}" value="${x}">${x}</label>`).join('')}</div><div class="error" id="err-g${i}"></div></div>`;box.append(row)});rates.forEach((name,i)=>{let row=document.createElement('div');row.className='row';row.innerHTML=`<div class="label req">${name}：</div><div><div class="stars" role="radiogroup" aria-label="${name}">${[1,2,3,4,5].map(n=>`<button type="button" class="star" role="radio" aria-checked="false" aria-label="${n}星" data-value="${n}">☆</button>`).join('')}</div><div class="error" id="err-r${i}"></div></div>`;row.querySelectorAll('.star').forEach(btn=>btn.addEventListener('click',()=>{row.dataset.value=btn.dataset.value;row.querySelectorAll('.star').forEach(b=>{let on=+b.dataset.value<=+btn.dataset.value;b.classList.toggle('selected',on);b.textContent=on?'★':'☆';b.setAttribute('aria-checked',b===btn)});row.querySelector('.error').textContent=''}));box.append(row)});const count=document.querySelector('#count'),ce=document.querySelector('#continueError');document.querySelectorAll('[name=continue]').forEach(r=>r.addEventListener('change',()=>{count.classList.toggle('hidden',r.value!=='yes');ce.textContent=''}));document.querySelector('#form').addEventListener('submit',e=>{e.preventDefault();let valid=true;groups.forEach((g,i)=>{let el=document.querySelector('#err-g'+i);el.textContent=document.querySelector(`[name=group${i}]:checked`)?'':`${g[0]}不能为空`;if(el.textContent)valid=false});rates.forEach((n,i)=>{let row=box.querySelectorAll('.row')[i+2],el=document.querySelector('#err-r'+i);el.textContent=row.dataset.value?'':`${n}不能为空`;if(el.textContent)valid=false});let chosen=document.querySelector('[name=continue]:checked');ce.textContent=!chosen?'请选择是否需要继续上课':chosen.value==='yes'&&(!count.value||+count.value<1||!Number.isInteger(+count.value))?'请输入大于 0 的整数小时数':'';if(ce.textContent)valid=false;if(valid){let n=document.querySelector('#notice');n.classList.remove('hidden');setTimeout(()=>n.classList.add('hidden'),3500)}else document.querySelector('.error:not(:empty)')?.scrollIntoView({behavior:'smooth',block:'center'})});document.querySelector('#cancel').addEventListener('click',()=>{document.querySelector('#form').reset();document.querySelectorAll('.star').forEach(b=>{b.classList.remove('selected');b.textContent='☆';b.setAttribute('aria-checked','false')});document.querySelectorAll('#assessment .row').forEach(r=>delete r.dataset.value);document.querySelectorAll('.error').forEach(e=>e.textContent='');count.classList.add('hidden');window.scrollTo({top:0,behavior:'smooth'})});

const viewing=document.querySelector('#viewing'),editing=document.querySelector('#editing');let currentMode='pc-edit';
function safe(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function collect(){return {groups:groups.map((_,i)=>Array.from(document.querySelectorAll(`[name=group${i}]:checked`)).map(x=>x.value).join('、')),rates:Array.from(document.querySelectorAll('#assessment .row')).slice(2).map(r=>r.dataset.value||''),advice:document.querySelector('#advice').value,cont:document.querySelector('[name=continue]:checked')?.value||'',count:count.value}}
function view(){let d;try{d=JSON.parse(localStorage.getItem('lesson-feedback-demo')||'null')}catch{};if(!d)d={groups:['态度端正、上课积极','无'],rates:['4','4','4','4'],advice:'作业：完成课后练习，周五前提交。\n学习建议：复习本节课重点。',cont:'yes',count:'2'};let sections=[['基本信息',[['学生姓名','示例学生'],['课程名称','升学规划课-综合-线上'],['授课老师','示例教师'],['上课时间','2026-07-13 21:00 - 21:30']]],['学生点评',groups.map(([n],i)=>[n,d.groups[i]||'暂无']).concat(rates.map((n,i)=>[n,d.rates[i]?('★'.repeat(+d.rates[i])+'☆'.repeat(5-(+d.rates[i]))):'暂无']))],['课后学习建议',[['课后学习建议',d.advice||'暂无']]],['是否需要继续上课',[['是否需要继续上课',d.cont==='yes'?'是':d.cont==='no'?'否':'暂无']].concat(d.cont==='yes'?[['建议续课时长',d.count+' 小时']]:[])]];viewing.innerHTML='<div class="view-shell">'+sections.map(([title,rows])=>`<section class="view-section"><h2>${safe(title)}</h2>${rows.map(([k,v])=>`<div class="view-row"><div class="view-label">${safe(k)}</div><div class="view-value">${safe(v)}</div></div>`).join('')}</section>`).join('')+'<div class="view-actions"><button type="button" class="action" id="view-close">返回编辑</button></div></div>';document.querySelector('#view-close').onclick=()=>mode(currentMode.startsWith('mobile')?'mobile-edit':'pc-edit')}
function mode(m){currentMode=m;let isView=m.endsWith('view');document.body.classList.toggle('mobile-mode',m.startsWith('mobile'));editing.classList.toggle('hidden',isView);viewing.classList.toggle('hidden',!isView);document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));if(isView)view();window.scrollTo(0,0)}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>mode(b.dataset.mode));document.querySelector('#form').addEventListener('submit',()=>{if(!document.querySelector('.error:not(:empty)')){try{localStorage.setItem('lesson-feedback-demo',JSON.stringify(collect()))}catch{};mode(currentMode.startsWith('mobile')?'mobile-view':'pc-view')}});mode('pc-edit');
</script></body></html>
